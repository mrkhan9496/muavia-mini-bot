<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BABA SAB JANTA HAI — Pairing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #0a1428 0%, #101d38 50%, #0a1428 100%);
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 24px 16px; color: #e8eef7;
  }
  .card {
    width: 100%; max-width: 420px; background: rgba(22, 33, 58, 0.85);
    border: 1px solid rgba(80, 120, 200, 0.25); border-radius: 24px;
    padding: 28px 24px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .header h1 { font-size: 21px; font-weight: 800; }
  .header h1 .gold { color: #f5b942; }
  .header p { font-size: 13px; color: #8fa3c7; margin-top: 3px; }
  label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .input-wrap {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(80, 120, 200, 0.35);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 8px;
  }
  .input-wrap input {
    flex: 1; background: none; border: none; outline: none;
    color: #fff; font-size: 17px; letter-spacing: 1px;
  }
  .hint { font-size: 12.5px; color: #8fa3c7; margin-bottom: 18px; }
  .btn-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .btn-row button {
    flex: 1; padding: 16px 8px; border: none; border-radius: 14px;
    font-size: 15px; font-weight: 700; cursor: pointer; color: #fff;
  }
  #qrBtn { background: linear-gradient(135deg, #2b7fff, #1f6ae0); }
  #codeBtn { background: linear-gradient(135deg, #f5b942, #d1942a); }
  button:disabled { opacity: 0.55; cursor: wait; }
  .result-box {
    border: 1.5px dashed rgba(120, 150, 200, 0.45); border-radius: 14px;
    padding: 20px 14px; text-align: center; font-size: 14px; color: #7d92b5;
    margin-bottom: 14px; min-height: 64px;
  }
  .result-box .code { font-size: 32px; font-weight: 800; letter-spacing: 6px; color: #fff; font-family: monospace; }
  .result-box img { width: 220px; height: 220px; border-radius: 8px; background: #fff; padding: 8px; }
  .result-box.error { color: #ff8a8a; border-color: rgba(255, 120, 120, 0.5); }
  .steps {
    background: rgba(43, 127, 255, 0.08); border: 1px solid rgba(43, 127, 255, 0.25);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
    font-size: 13.5px; color: #a9bcd8; line-height: 1.7;
  }
  .footer { text-align: center; font-size: 12.5px; color: #5a6f93; padding-top: 16px; }
  .footer .gold { color: #f5b942; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div>
        <h1>BABA SAB <span class="gold">JANTA HAI</span></h1>
        <p>Apna WhatsApp connect karo</p>
      </div>
    </div>

    <label for="number">WhatsApp Number</label>
    <div class="input-wrap">
      <span>📞</span>
      <input id="number" type="tel" inputmode="numeric" placeholder="923001234567" maxlength="15">
    </div>
    <p class="hint">💡 Country code ke saath likhein (masalan 92)</p>

    <div class="btn-row">
      <button id="qrBtn">📱 QR Code</button>
      <button id="codeBtn">🔑 Pairing Code</button>
    </div>

    <div class="result-box" id="resultBox">Number dal kar QR ya Pairing Code chuno</div>
    <div class="steps" id="steps" hidden></div>

    <div class="footer">© 2026 BABA SAB JANTA HAI | Powered By <span class="gold">Mr Muavia</span></div>
  </div>

<script>
  const input = document.getElementById('number');
  const qrBtn = document.getElementById('qrBtn');
  const codeBtn = document.getElementById('codeBtn');
  const box = document.getElementById('resultBox');
  const steps = document.getElementById('steps');
  let sessionId = null;
  let qrTimer = null;

  function getNumber() {
    const n = input.value.replace(/[^0-9]/g, '');
    if (n.length < 10 || n.length > 15) {
      box.className = 'result-box error';
      box.textContent = '❌ Sahi number likhein (country code ke saath).';
      return null;
    }
    return n;
  }
  function setBusy(b) { qrBtn.disabled = b; codeBtn.disabled = b; }

  async function newSession() {
    const res = await fetch('/api/session/new', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Session nahi bana.');
    sessionId = data.sessionId;
    return sessionId;
  }

  // QR flow
  qrBtn.onclick = async () => {
    if (!getNumber()) return;
    setBusy(true);
    box.className = 'result-box';
    box.textContent = '⏳ Session ban raha hai...';
    steps.hidden = true;
    if (qrTimer) clearInterval(qrTimer);
    try {
      await newSession();
      box.textContent = '⏳ QR ban raha hai...';
      const loadQR = async () => {
        try {
          const res = await fetch('/api/qr?session=' + sessionId);
          const data = await res.json();
          if (data.paired) {
            box.innerHTML = '<div style="color:#7dff9a;font-weight:700;">✅ Paired ho gaya!</div>';
            if (qrTimer) clearInterval(qrTimer);
            return;
          }
          if (data.qr) {
            box.innerHTML = '<img src="' + data.qr + '" alt="QR">';
            steps.hidden = false;
            steps.innerHTML = '<b>QR mila? Ab ye karo:</b><br>1️⃣ WhatsApp kholo → <b>Settings → Linked Devices</b><br>2️⃣ <b>Link a Device</b> dabao<br>3️⃣ QR scan karo ✅';
          } else {
            box.textContent = '⏳ ' + (data.message || 'QR ban raha hai...');
          }
        } catch (e) { box.textContent = '❌ QR load nahi hua.'; }
      };
      await loadQR();
      qrTimer = setInterval(loadQR, 15000);
    } catch (e) {
      box.className = 'result-box error';
      box.textContent = '❌ ' + e.message;
    } finally {
      setBusy(false);
    }
  };

  // Pairing code flow
  codeBtn.onclick = async () => {
    const number = getNumber();
    if (!number) return;
    setBusy(true);
    box.className = 'result-box';
    box.textContent = '⏳ Code ban raha hai...';
    steps.hidden = true;
    if (qrTimer) clearInterval(qrTimer);
    try {
      await newSession();
      const res = await fetch('/api/pair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ number, session: sessionId }),
      });
      const data = await res.json();
      if (!res.ok) {
        box.className = 'result-box error';
        box.textContent = '❌ ' + (data.error || 'Code nahi bana.');
        return;
      }
      box.innerHTML = '<div class="code">' + data.code + '</div>';
      steps.hidden = false;
      steps.innerHTML = '<b>Code mil gaya? Ab ye karo:</b><br>1️⃣ WhatsApp kholo → <b>Settings → Linked Devices</b><br>2️⃣ <b>Link a Device</b> dabao<br>3️⃣ <b>"Link with phone number"</b> chuno<br>4️⃣ Upar wala code dalo ✅';
    } catch (e) {
      box.className = 'result-box error';
      box.textContent = '❌ Server se rabta nahi.';
    } finally {
      setBusy(false);
    }
  };
</script>
</body>
</html>
